services:
  - type: web
    name: cobri-api
    runtime: python
    plan: free
    buildCommand: pip install ./backend
    startCommand: alembic upgrade head && uvicorn cobri.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: COBRI_DATABASE_URL
        fromDatabase:
          name: cobri-db
          property: connectionString
      - key: COBRI_AUTO_CREATE_SCHEMA
        value: "false"
      - key: COBRI_SANDBOX_ENABLED
        value: "false"
      - key: COBRI_EVALUATION_MODE
        value: provider
      - key: COBRI_CORS_ORIGINS
        value: '["https://cobri-frontend.onrender.com"]'
      - key: COBRI_AUTH_ISSUER
        sync: false
      - key: COBRI_AUTH_AUDIENCE
        sync: false
      - key: COBRI_AUTH_JWKS_URL
        sync: false
      - key: COBRI_GROQ_API_KEY
        sync: false
      - key: COBRI_OPENROUTER_API_KEY
        sync: false

  - type: worker
    name: cobri-worker
    runtime: python
    plan: free
    buildCommand: pip install ./backend
    startCommand: python -m cobri.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: COBRI_DATABASE_URL
        fromDatabase:
          name: cobri-db
          property: connectionString
      - key: COBRI_AUTO_CREATE_SCHEMA
        value: "false"
      - key: COBRI_SANDBOX_ENABLED
        value: "false"
      - key: COBRI_EVALUATION_MODE
        value: provider
      - key: COBRI_AUTH_ISSUER
        sync: false
      - key: COBRI_AUTH_AUDIENCE
        sync: false
      - key: COBRI_AUTH_JWKS_URL
        sync: false
      - key: COBRI_GROQ_API_KEY
        sync: false
      - key: COBRI_OPENROUTER_API_KEY
        sync: false

  - type: web
    name: cobri-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cobri-api.onrender.com
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false

databases:
  - name: cobri-db
    plan: free
